# Only treat the connection as a WebSocket upgrade when the client actually
# asked for one; otherwise keep it a normal keep-alive HTTP connection.
map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

server {
    server_name ireachflow.com;
    listen 443 ssl;

    ssl_certificate /etc/letsencrypt/live/ireachflow.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/ireachflow.com/privkey.pem;

    charset utf-8;
    gzip on;
    gzip_proxied expired no-cache no-store private auth;
    gzip_types text/css text/xml application/javascript text/plain application/json image/svg+xml image/x-icon;
    gzip_comp_level 1;

    # Video calls need camera/mic access on this origin only.
    add_header Permissions-Policy "camera=(self), microphone=(self), display-capture=(self)" always;

    # Angular frontend (static build, served directly by nginx).
    root /var/www/ireachflow/frontend/dist/ireachflow;
    index index.html;

    location / {
        try_files $uri $uri/ /index.html;
    }

    # Hashed build assets (outputHashing: "all") can be cached indefinitely.
    location ~* \.(?:css|js|woff2?|ttf|eot|svg|png|jpe?g|gif|ico)$ {
        try_files $uri =404;
        expires 30d;
        add_header Cache-Control "public, immutable";
    }

    # NestJS API (global prefix /api).
    location /api/ {
        proxy_pass http://127.0.0.1:4000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Authorization $http_authorization;
        proxy_read_timeout 300s;
        include /etc/nginx/proxy_params;
    }

    # WebRTC signaling for video call sessions (call setup/offer/answer/ICE
    # candidate exchange only — the actual audio/video media never passes
    # through nginx, it flows peer-to-peer or via a TURN relay). Covers both
    # the Socket.IO default path and a gateway mounted under /api; adjust the
    # prefix here if the signaling gateway ends up on a different path.
    location /socket.io/ {
        proxy_pass http://127.0.0.1:4000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_buffering off;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
        include /etc/nginx/proxy_params;
    }

    location /api/socket.io/ {
        proxy_pass http://127.0.0.1:4000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_buffering off;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
        include /etc/nginx/proxy_params;
    }

    error_log /var/www/logs/ireachflow/ireachflow.com.error.log;
    access_log /var/www/logs/ireachflow/ireachflow.com.access.log;
}

server {
    server_name ireachflow.com;
    listen 80;
    return 301 https://$host$request_uri;

    error_log /var/www/logs/ireachflow/ireachflow.com.error.log;
    access_log /var/www/logs/ireachflow/ireachflow.com.access.log;
}

server {
    server_name www.ireachflow.com;
    listen 80;
    listen 443 ssl;

    ssl_certificate /etc/letsencrypt/live/ireachflow.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/ireachflow.com/privkey.pem;

    return 301 $scheme://ireachflow.com$request_uri;

    error_log /var/www/logs/ireachflow/ireachflow.com.error.log;
    access_log /var/www/logs/ireachflow/ireachflow.com.access.log;
}
