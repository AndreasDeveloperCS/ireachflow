<div class="dashboard">
  <h1>Welcome back{{ authService.currentUser ? ', ' + authService.currentUser.firstName : '' }}</h1>
  <p class="subtitle">Here's what's happening with your account.</p>

  <div class="stats-row">
    <div class="stat-card">
      <span class="stat-label">Emails sent</span>
      <span class="stat-value">{{ emailsSent ?? '—' }}</span>
    </div>
    <div class="stat-card">
      <span class="stat-label">Team members</span>
      <span class="stat-value">{{ teamSize ?? '—' }}</span>
    </div>
  </div>

  <h2>Quick actions</h2>
  <div class="quick-links">
    <a class="quick-link-card" *ngFor="let link of quickLinks" [routerLink]="link.path">
      <mat-icon>{{ link.icon }}</mat-icon>
      <div>
        <h3>{{ link.title }}</h3>
        <p>{{ link.body }}</p>
      </div>
    </a>
  </div>
</div>
