<div class="auth-page">
  <div class="auth-card">
    <a class="auth-brand" routerLink="/">
      <img src="assets/branding/ireachflow-logo.svg" alt="iReachFlow" height="32">
      <span>iReachFlow</span>
    </a>

    <h1>Welcome back</h1>
    <p class="auth-subtitle">Log in to keep your campaigns running.</p>

    <form [formGroup]="form" (ngSubmit)="submit()">
      <mat-form-field appearance="outline">
        <mat-label>Email</mat-label>
        <input matInput type="email" formControlName="email" autocomplete="email">
        <mat-error *ngIf="form.controls.email.hasError('required')">Email is required</mat-error>
        <mat-error *ngIf="form.controls.email.hasError('email')">Enter a valid email</mat-error>
      </mat-form-field>

      <mat-form-field appearance="outline">
        <mat-label>Password</mat-label>
        <input matInput type="password" formControlName="password" autocomplete="current-password">
        <mat-error *ngIf="form.controls.password.hasError('required')">Password is required</mat-error>
      </mat-form-field>

      <div class="auth-error" *ngIf="errorMessage">{{ errorMessage }}</div>

      <button mat-flat-button color="primary" class="auth-submit" type="submit" [disabled]="submitting">
        {{ submitting ? 'Logging in…' : 'Log in' }}
      </button>
    </form>

    <p class="auth-switch">Don't have an account? <a routerLink="/register">Start Free</a></p>
  </div>
</div>
